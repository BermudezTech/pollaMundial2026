version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/usr/src/app/data/dev.db
    volumes:
      - sqlite_data:/usr/src/app/data
    restart: always

volumes:
  sqlite_data:
